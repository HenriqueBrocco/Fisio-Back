name: CI

on:
  push:
    branches: ["main"]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: fisio
          POSTGRES_USER: fisio
          POSTGRES_PASSWORD: fisio
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U fisio -d fisio"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=10

    env:
      DATABASE_URL: postgresql+psycopg://fisio:fisio@127.0.0.1:5432/fisio
      SECRET_KEY: ci-secret
      TEST_PRO_EMAIL: admin@admin.com
      TEST_PRO_PASSWORD: 123

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements/dev.txt

      - name: Ruff
        run: ruff check .

      - name: Black (check)
        run: black . --check

      - name: Run migrations
        run: alembic upgrade head